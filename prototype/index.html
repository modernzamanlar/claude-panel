<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Panel</title>
<style>
:root{
  --bg:#faf9f5; --side:#f3f1ea; --panel:#ffffff; --hover:#ebe8de; --active:#e4e0d3;
  --line:#e6e3d8; --line2:#d9d5c7; --text:#22211f; --muted:#75736c; --faint:#a19f96;
  --accent:#c96442; --accent-soft:#f5e3da; --accent-text:#9e4a2e;
  --user:#f0eee6; --code:#f5f4ef; --ok:#4f8a5b; --warn:#c08a2e; --track:#e9e6dc;
  --sel:#c96442; --c-msg:#4f86e8; --c-mcp:#d46a2f; --c-sys:#4fa585; --c-skill:#c99a22; --c-gray:#a8a69e; --c-dark:#7d7b74; --c-free:#e1ded3;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --serif: ui-serif, "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#262624; --side:#1f1e1c; --panel:#2b2a27; --hover:#302f2c; --active:#393834;
    --line:#383733; --line2:#45443f; --text:#ece9e1; --muted:#a3a097; --faint:#77756e;
    --accent:#d97757; --accent-soft:#3d2c24; --accent-text:#e89a7d; --track:#3a3935;
    --sel:#c4613f; --user:#34332f; --code:#22211f; --c-free:#3a3935; --c-gray:#8e8c85; --c-dark:#5e5d58;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#262624; --side:#1f1e1c; --panel:#2b2a27; --hover:#302f2c; --active:#393834;
  --line:#383733; --line2:#45443f; --text:#ece9e1; --muted:#a3a097; --faint:#77756e;
  --accent:#d97757; --accent-soft:#3d2c24; --accent-text:#e89a7d; --track:#3a3935;
  --sel:#c4613f; --user:#34332f; --code:#22211f; --c-free:#3a3935; --c-gray:#8e8c85; --c-dark:#5e5d58;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13.5px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grow{flex:1}
.mono{font-family:var(--mono);font-size:11px}
.app{display:grid;grid-template-columns:56px 1fr auto;grid-template-rows:44px 1fr;height:100vh}

/* ---------- Top bar ---------- */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:var(--side);position:relative;z-index:35}
.lights{display:flex;gap:7px;margin-right:6px}
.lights i{width:12px;height:12px;border-radius:50%;background:var(--line2);display:block}
.brand{display:flex;align-items:center;gap:7px;font-weight:600}
.brand .logo{width:20px;height:20px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand .logo svg{width:13px;height:13px;stroke-width:2.2}
.ibtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn.on{background:var(--active);color:var(--text)}
.layouts{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
.layouts button{width:30px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.layouts button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.layouts svg{width:18px;height:14px}
.tb-title{font-size:12.5px;color:var(--muted)}
.tb-title b{color:var(--text);font-weight:500}
.vline{width:1px;height:20px;background:var(--line)}

/* ---------- Rail (collapsed left menu) ---------- */
.rail{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;min-height:0;position:relative;z-index:35}
.rail .ibtn{width:36px;height:36px;border-radius:10px}
.rail .new{background:var(--accent);color:#fff}
.rail .new:hover{background:var(--accent);filter:brightness(1.08);color:#fff}
.rail hr{width:24px;border:0;border-top:1px solid var(--line);margin:6px 0}
.rail .pchip{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted);border:1px solid var(--line);position:relative;background:var(--panel)}
.rail .pchip.act{border-color:var(--accent);color:var(--accent-text)}
.rail .pchip i{position:absolute;left:-1px;top:7px;bottom:7px;width:3px;border-radius:2px}
.rail .pchip .rs{position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--side)}
.rail .live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);margin:8px 0}
.tip{position:absolute;left:46px;white-space:nowrap;background:var(--text);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;pointer-events:none;opacity:0;transition:.12s;z-index:60}
.ibtn:hover .tip,.pchip:hover .tip{opacity:1}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.grid{flex:1;display:grid;gap:8px;padding:8px;min-height:0}
.grid.l1{grid-template-columns:1fr}
.grid.l2{grid-template-columns:1fr 1fr}
.grid.l3{grid-template-columns:1fr 1fr 1fr}
.grid.l4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}

/* ---------- Pane ---------- */
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative;transition:border-color .15s, box-shadow .15s}
.pane.active{border-color:var(--line2);box-shadow:var(--shadow)}
.pane.active .ph-num{background:var(--accent);color:#fff}
.pane.dropping{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ph{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line);min-width:0;flex:none}
.ph-num{font:600 10.5px var(--mono);width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--hover);color:var(--muted);flex:none}
.ph-main{flex:1;min-width:0}
.ph-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-sub{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.sep{color:var(--faint)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);flex:none}
.status .sd{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.run{color:var(--accent-text)} .status.run .sd{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.status.else{color:var(--warn)} .status.else .sd{background:var(--warn)}
.pane.compact .status .st-l{display:none}
@keyframes pulse{50%{opacity:.35}}
.banner{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;background:color-mix(in srgb,var(--warn) 12%,var(--panel));border-bottom:1px solid var(--line)}
.banner button{padding:3px 9px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);font-size:12px}
.msgs{flex:1;overflow:auto;padding:18px 0 8px;min-height:0}
.msgs-in{max-width:720px;margin:0 auto;padding:0 18px;display:flex;flex-direction:column;gap:14px}
.u{align-self:flex-end;max-width:85%;background:var(--user);border-radius:14px;padding:9px 13px;white-space:pre-wrap}
.a{font-family:var(--serif);font-size:15px;line-height:1.6}
.a p{margin:0 0 8px} .a p:last-child{margin:0}
.a code{font:12.5px var(--mono);background:var(--code);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.a pre{font:12px/1.55 var(--mono);background:var(--code);border:1px solid var(--line);border-radius:9px;padding:10px 12px;overflow:auto;margin:6px 0}
.tool{font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:6px 0}
.tool-h{display:flex;align-items:center;gap:7px;padding:6px 10px;color:var(--muted);cursor:pointer}
.tool-h:hover{background:var(--hover)}
.tool-h b{color:var(--text);font-weight:500}
.tool-h .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tool-h .chev{width:13px;height:13px;transition:transform .15s}
.tool.open .chev{transform:rotate(90deg)}
.tool-b{display:none;font:11.5px/1.5 var(--mono);padding:8px 10px;border-top:1px solid var(--line);background:var(--code);white-space:pre-wrap;color:var(--muted)}
.tool.open .tool-b{display:block}
.cursor::after{content:"";display:inline-block;width:7px;height:15px;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:pulse 1s infinite}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}
.empty .ring{width:44px;height:44px;border-radius:12px;border:1.5px dashed var(--line2);display:grid;place-items:center;margin:0 auto 10px;color:var(--faint)}
.empty h3{margin:0 0 4px;font:500 17px var(--serif);color:var(--text)}
.empty p{margin:0;font-size:12.5px}
.empty .recent{margin-top:14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:220px}
.empty .recent button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;display:flex;gap:7px;align-items:center;font-size:12.5px}
.empty .recent button:hover{background:var(--hover)}
.comp-wrap{padding:6px 14px 12px;flex:none}
.comp{max-width:720px;margin:0 auto;border:1px solid var(--line2);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 10px 8px 14px}
.comp textarea{width:100%;border:0;outline:0;resize:none;background:none;min-height:22px;max-height:140px;line-height:1.5}
.comp-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:3px 8px;border-radius:7px;border:1px solid var(--line)}
.pill:hover{background:var(--hover);color:var(--text)}
.send{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.send svg{stroke-width:2.2}
.send.stop{background:var(--text);color:var(--panel)}
.pane.compact .pill.hide-c{display:none}

/* ---------- Info panel (right) ---------- */
.info{width:320px;border-left:1px solid var(--line);background:var(--side);overflow:auto;min-height:0;font-size:13px}
.info.off{display:none}
.info-h{display:flex;align-items:center;gap:8px;padding:12px 16px 4px;font-size:12px;color:var(--muted)}
.info-h b{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isec{padding:12px 16px 14px;border-bottom:1px solid var(--line)}
.isec:last-child{border-bottom:0}
.isec h4{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.isec h4 button{color:var(--faint);display:flex}
.irow{display:flex;align-items:center;gap:10px;padding:5px 0;min-width:0}
.irow .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .sub{color:var(--muted)}
.irow .act{color:var(--text);text-decoration:underline;text-underline-offset:3px;font-size:12.5px}
.irow .warn{color:var(--warn);font-size:12.5px}
.irow .ok{color:var(--faint);font-size:11.5px}
.irow svg.i{color:var(--muted)}
.switch{width:32px;height:18px;border-radius:9px;background:var(--line2);position:relative;transition:.15s;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)} .switch.on::after{left:16px}
.ctx-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ctx-top b{font-weight:600}
.ctx-top span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--track);display:flex;overflow:hidden;gap:1px;margin-bottom:10px}
.bar i{display:block;height:100%}
.leg{display:grid;grid-template-columns:12px 1fr auto 48px;gap:4px 9px;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.leg .sw{width:10px;height:10px;border-radius:2px}
.leg .n{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.leg .n.u{text-decoration:underline dotted;text-underline-offset:3px}
.leg .v{color:var(--muted);text-align:right}
.leg .p{text-align:right}
.leg .gap{grid-column:1/-1;height:4px}
.leg .dim{color:var(--faint)}
.exp{display:flex;align-items:center;gap:6px;color:var(--muted);padding:3px 0;font-size:12.5px;width:100%}
.exp .chev{width:12px;height:12px;transition:transform .15s}
.exp.open .chev{transform:rotate(90deg)}
.exp span:last-child{margin-left:auto;color:var(--faint)}
.exp-b{display:none;padding:2px 0 4px 18px;font:11.5px/1.7 var(--mono);color:var(--muted)}
.exp.open + .exp-b{display:block}
.conn-ic{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font:700 10.5px var(--sans);color:#fff;flex:none}

/* ---------- Organizer (full-screen left menu) ---------- */
.org{position:fixed;left:56px;top:44px;right:0;bottom:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;opacity:0;transform:translateX(-12px);pointer-events:none;transition:opacity .18s, transform .18s}
.org.open{opacity:1;transform:none;pointer-events:auto}
.org-h{display:flex;align-items:center;gap:10px;padding:14px 20px 10px;flex:none;flex-wrap:wrap}
.org-h h2{margin:0;font:500 21px var(--serif);margin-right:6px}
.search{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);width:260px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--text)}
.kbd{font:11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.seg{display:flex;background:var(--hover);border-radius:8px;padding:2px}
.seg button{padding:4px 12px;border-radius:6px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07);background:var(--accent)}
.board{flex:1;overflow:auto;padding:4px 20px 16px;min-height:0;column-width:270px;column-gap:12px}
.board > *{break-inside:avoid;margin-bottom:12px}
.board.flat{column-width:300px}
.col{background:var(--side);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;transition:border-color .12s, box-shadow .12s}
.col.drop{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.insert{box-shadow:0 -3px 0 0 var(--accent) !important}
.board.droptop{outline:2px dashed var(--accent);outline-offset:-6px;border-radius:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{padding:4px 11px;border-radius:16px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);background:var(--panel)}
.chipb:hover{color:var(--text)}
.chipb.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chipb em{font-style:normal;opacity:.6;margin-left:3px}
.card .fchip{display:inline-flex;align-items:center;gap:4px;flex:none}
.remote-box{margin:4px 0 6px 26px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px;display:flex;gap:10px;font-size:12px}
.remote-box .qr{width:68px;height:68px;flex:none;border-radius:6px;background:#fff;padding:4px;border:1px solid var(--line)}
.remote-box .rt{display:flex;flex-direction:column;gap:4px;min-width:0;color:var(--muted)}
.remote-box .rt .mono{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remote-box .rt .st{display:flex;align-items:center;gap:5px}
.remote-box .rt .st i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.remote-box .rt .st.ok i{background:var(--ok)}
.remote-box .rt button{align-self:flex-start;padding:2px 8px;border:1px solid var(--line2);border-radius:6px;font-size:11.5px;color:var(--text)}
.rc-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--accent-text);background:var(--accent-soft);border-radius:5px;padding:1px 6px;flex:none}
.rc-badge svg{width:11px;height:11px}
.pane.compact .rc-badge span{display:none}
.isec h4 .sum{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}
.isec h4 .tg{color:var(--muted);display:flex;transition:transform .15s}
.isec h4 .tg.open{transform:rotate(90deg)}
.isec h4.click{cursor:pointer;margin:0}
.isec h4.click + .conn-list{margin-top:10px}
.col-h{display:flex;align-items:center;gap:8px;padding:11px 12px 8px;cursor:grab;flex:none}
.col-h .dot{width:10px;height:10px;border-radius:3px}
.col-h .chev{width:13px;height:13px;color:var(--faint);transition:transform .15s}
.col-h .chev.open{transform:rotate(90deg)}
.col-h .nm{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-h .cnt{font-size:11.5px;color:var(--faint)}
.col-h .ibtn{width:24px;height:24px;border-radius:6px}
.col-b{overflow:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:6px;min-height:40px}
.col.ghost{background:none;border:1.5px dashed var(--line2);display:grid;place-items:center;height:110px;color:var(--muted);cursor:pointer}
.col.ghost:hover{color:var(--text);border-color:var(--faint)}
.sub{border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--panel) 45%,transparent);transition:border-color .12s}
.sub.drop{border-color:var(--accent);background:var(--accent-soft)}
.sub-h{display:flex;align-items:center;gap:7px;padding:6px 9px;font-size:12.5px;font-weight:500;cursor:grab}
.sub-h .chev{width:13px;height:13px;color:var(--faint);transition:transform .15s}
.sub-h .chev.open{transform:rotate(90deg)}
.sub-h .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-b{padding:0 6px 6px;display:flex;flex-direction:column;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;position:relative}
.card:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.card.dragging{opacity:.4}
.card .t{font-weight:500;display:flex;align-items:center;gap:6px;padding-right:22px}
.card .t span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11.5px;color:var(--muted);min-width:0}
.card .m .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .m .ago{margin-left:auto;flex:none;color:var(--faint)}
.card .pn{position:absolute;right:8px;top:8px;font:600 10px var(--mono);color:#fff;background:var(--accent);border-radius:4px;padding:0 4px}
.card .fresh{position:absolute;right:8px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.card .pinI{color:var(--faint);width:12px;height:12px}
.spin{width:12px;height:12px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.edot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.rename{border:1px solid var(--accent);border-radius:5px;padding:0 5px;outline:0;background:var(--panel);flex:1;min-width:0;font-weight:600}
.dock{flex:none;border-top:1px solid var(--line);padding:10px 20px 14px;display:flex;align-items:center;gap:10px;background:var(--side)}
.dock .lbl{font-size:12px;color:var(--muted);flex:none}
.slots{display:flex;gap:8px;flex:1;min-width:0}
.slot{flex:1;min-width:0;max-width:260px;border:1.5px dashed var(--line2);border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.slot.full{border-style:solid;background:var(--panel)}
.slot.act{border-color:var(--accent)}
.slot.drop{border-color:var(--accent);background:var(--accent-soft)}
.slot b{font:600 11px var(--mono);width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--hover);color:var(--muted);flex:none}
.slot.act b{background:var(--accent);color:#fff}
.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.slot.full span{color:var(--text)}

/* ---------- Finder / Gezgin tarzı klasör penceresi ---------- */
.org{flex-direction:row !important}
.fx-side{width:210px;flex:none;background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:12px 8px;font-size:13px}
.fx-sh{font-size:11px;font-weight:600;color:var(--faint);padding:10px 8px 4px}
.fx-sh:first-child{padding-top:0}
.fx-si{display:flex;align-items:center;gap:8px;width:100%;padding:4px 8px;border-radius:7px;text-align:left;min-width:0;color:var(--text)}
.fx-si:hover{background:var(--hover)}
.fx-si.on{background:var(--active)}
.fx-si.drop{background:var(--sel);color:#fff}
.fx-si svg{color:var(--accent)}
.fx-si.trash{margin-top:2px}
.fx-si .fsm{width:16px;height:14px;flex:none}
.fx-si span.l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-si em{font-style:normal;font-size:11px;color:var(--faint)}
.fx-si .tw{width:12px;height:12px;flex:none;color:var(--faint);transition:transform .12s;display:grid;place-items:center}
.fx-si .tw.open{transform:rotate(90deg)}
.fx-si .tw svg{color:var(--faint);width:11px;height:11px}
.fx-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.fx-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.fx-nav{display:flex}
.fx-nav .ibtn:disabled{opacity:.3;cursor:default;background:none}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;font-size:13px}
.crumbs button{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:6px;white-space:nowrap;color:var(--muted)}
.crumbs button:hover{background:var(--hover);color:var(--text)}
.crumbs button.cur{color:var(--text);font-weight:600}
.crumbs button.drop{background:var(--sel);color:#fff}
.crumbs .sp{color:var(--faint);font-size:12px}
.crumbs .fsm{width:16px;height:14px}
#fxView button{padding:3px 8px;display:grid;place-items:center}
#fxView svg{width:15px;height:15px}
.fx-body{flex:1;overflow:auto;min-height:0;position:relative}
.fx-body.dropin{box-shadow:inset 0 0 0 2px var(--sel)}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px 8px;padding:18px 20px 30px;align-content:start}
.fx-it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 6px;border-radius:10px;cursor:default;user-select:none;position:relative;outline:0}
.fx-it .ic{width:76px;height:64px;display:grid;place-items:center;border-radius:9px;position:relative}
.fx-it.sel .ic{background:var(--hover)}
.fx-it .nm{font-size:12.5px;text-align:center;line-height:1.3;padding:1px 5px;border-radius:5px;max-width:112px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.fx-it.sel .nm{background:var(--sel);color:#fff}
.fx-it .sb{font-size:11px;color:var(--faint);max-width:112px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-it .tagdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.fx-it.drop .ic{background:var(--sel);}
.fx-it.drop .fb{fill:#9f4627} .fx-it.drop .ff{fill:#c4623f}
.fx-it.cut{opacity:.45}
.fx-it.spring .ic{animation:spr .25s ease-in-out 2}
@keyframes spr{50%{transform:scale(1.08)}}
.fx-it.dragging{opacity:.4}
.fx-it .rename,.fx-row .rename{font-size:12.5px;font-weight:400;text-align:center;max-width:112px}
.fsvg{width:72px;height:58px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.fb{fill:#c45f3c} .ff{fill:#e0825f}
.papers .pp1{fill:#fffdf8;stroke:#e3dccf;stroke-width:.6} .papers .pp2{fill:#f1ede4;stroke:#ddd5c6;stroke-width:.6}
.papers .pl{stroke:#d8d1c3;stroke-width:1.3;stroke-linecap:round;fill:none} .papers .pa{stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;fill:none}
.fsm .papers .pl,.fsm .papers .pa{display:none}
.full .ff{filter:drop-shadow(0 -0.6px 0.6px rgba(0,0,0,.18))}
.fx-it:hover .papers{transform:translateY(-1.2px);transition:transform .15s}
.papers{transition:transform .15s}
:root[data-theme="dark"] .db{fill:#3b3a36;stroke:#55534d} :root[data-theme="dark"] .dc{fill:#4a4843;stroke:#55534d} :root[data-theme="dark"] .dl{stroke:#5a5852}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .db{fill:#3b3a36;stroke:#55534d} :root:not([data-theme="light"]) .dc{fill:#4a4843;stroke:#55534d} :root:not([data-theme="light"]) .dl{stroke:#5a5852} } .fl2{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1}
.dsvg{width:48px;height:60px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.14))}
.db{fill:#fff;stroke:#d5d2c7;stroke-width:1} .dc{fill:#ece9df;stroke:#d5d2c7;stroke-width:1;stroke-linejoin:round} .dl{stroke:#d9d6cc;stroke-width:2;stroke-linecap:round}
.dbub{fill:var(--accent)}
.badge-pn{position:absolute;right:4px;top:2px;font:600 10px var(--mono);color:#fff;background:var(--accent);border-radius:5px;padding:0 5px;line-height:16px}
.badge-st{position:absolute;left:6px;bottom:4px}
.badge-new{position:absolute;right:8px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--sel);border:2px solid var(--panel)}
.badge-cnt{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font:600 10px var(--sans);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.fx-empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:40px}
.fx-empty .fsvg{opacity:.35;width:96px;height:78px}
.fx-list{width:100%;border-collapse:collapse;font-size:13px}
.fx-list th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:500;font-size:11.5px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
.fx-list th:hover{color:var(--text)}
.fx-row td{padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;color:var(--muted)}
.fx-row td:first-child{color:var(--text)}
.fx-row:nth-child(even) td{background:color-mix(in srgb,var(--side) 55%,transparent)}
.fx-row.sel td{background:var(--sel) !important;color:#fff}
.fx-row.drop td{background:var(--sel) !important;color:#fff}
.fx-row .nmc{display:flex;align-items:center;gap:8px}
.fx-row .fsm{width:18px;height:15px;flex:none}
.fx-row .dsm{width:14px;height:17px;flex:none}
.fx-status{flex:none;display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--bg)}
.fx-status .slots{flex:none;max-width:60%}
.fx-status .slot{max-width:190px;padding:4px 8px;font-size:12px}
.fx-status .lbl{flex:none}

.drag-ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:12.5px;max-width:240px}
.drag-ghost span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drag-ghost b{background:var(--accent);color:#fff;border-radius:9px;font-size:11px;padding:0 6px}
body.dragging-now, body.dragging-now *{cursor:grabbing !important;user-select:none}
.fx-it .ic svg, .fx-row svg{pointer-events:none}
.fx-body.graph{overflow:hidden}
.gv{position:absolute;inset:0;background:#121110;overflow:hidden}
.gv canvas{display:block;touch-action:none}
.gv-hud{position:absolute;inset:0;pointer-events:none;color:#ece9e1;font-size:12.5px}
.gv-hud > *{pointer-events:auto}
.gv-top{position:absolute;left:12px;right:12px;top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;pointer-events:none}
.gv-top > *{pointer-events:auto}
.gv-stats{display:inline-flex;align-items:center;gap:8px;background:rgba(30,29,27,.8);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:5px 10px;backdrop-filter:blur(6px)}
.gv-live{width:8px;height:8px;border-radius:50%;background:#d97757;box-shadow:0 0 10px #d97757;animation:pulse 1.2s infinite}
.gv-b{display:inline-flex;align-items:center;gap:5px;background:rgba(30,29,27,.8);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:5px 10px;color:#d6d2c8;font-size:12px;backdrop-filter:blur(6px)}
.gv-b:hover{color:#fff;border-color:rgba(255,255,255,.22)}
.gv-b.on{background:#c96442;border-color:#c96442;color:#fff}
.gv-b svg{width:14px;height:14px}
.gv-card{position:absolute;left:12px;bottom:46px;width:300px;background:rgba(30,29,27,.92);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);backdrop-filter:blur(8px)}
.gv-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8f8c84;font-weight:600}
.gv-t{font:500 15px var(--serif);margin-top:2px}
.gv-m{font-size:12px;color:#a8a59c;margin-top:3px}
.gv-m .mono{color:#cfcabf}
.gv-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gv-acts .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#ece9e1;padding:4px 9px;font-size:12px}
.gv-acts .btn:hover{background:rgba(255,255,255,.12)}
.gv-acts .btn.pri{background:#c96442;border-color:#c96442}
.gv-acts .btn svg{width:13px;height:13px}
.gv-li{display:flex;align-items:center;gap:6px;padding:3px 0;color:#d6d2c8}
.gv-li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv-li em{color:#e8a487;font-style:normal}
.gv-li .ibtn{width:22px;height:22px;color:#8f8c84}
.gv-card .inp{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.12);color:#ece9e1}
.gv-legend{position:absolute;right:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;background:rgba(30,29,27,.8);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:6px 10px;font-size:11.5px;color:#a8a59c;max-width:60%}
.gv-legend span{display:inline-flex;align-items:center;gap:5px}
.gv-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.gv-legend i.glow{background:#ffb08a;box-shadow:0 0 8px #d97757}
.gv-legend b.dash{width:16px;border-top:2px dashed #d97757;display:inline-block}
.gv-hint{position:absolute;left:12px;bottom:14px;font-size:11.5px;color:#7d7a72;pointer-events:none}
.gv-card ~ .gv-legend{}
.fx-si.gv-si svg{color:var(--accent)}
.live-em{color:var(--accent) !important;font-weight:600}
/* full-screen search */
.srch{position:fixed;left:56px;top:44px;right:0;bottom:0;background:var(--bg);z-index:32;display:flex;flex-direction:column;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .16s, transform .16s}
.srch.open{opacity:1;transform:none;pointer-events:auto}
.sr-top{max-width:900px;width:100%;margin:0 auto;padding:28px 24px 10px;flex:none}
.sr-box{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:12px 16px}
.sr-box svg{width:20px;height:20px;color:var(--muted)}
.sr-box input{flex:1;min-width:0;border:0;outline:0;background:none;font:400 20px var(--serif);color:var(--text)}
.sr-opts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.sr-opts .vline{margin:0 4px}
.sr-opts .chipb .dot{margin-right:4px}
.sr-list{flex:1;overflow:auto;min-height:0}
.sr-in{max-width:900px;margin:0 auto;padding:4px 24px 24px}
.sr-gh{font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;padding:12px 4px 6px;display:flex;justify-content:space-between}
.sr-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.sr-row:hover{background:var(--hover)}
.sr-row.sel{background:var(--panel);border-color:var(--line2);box-shadow:var(--shadow)}
.sr-row .ico{width:30px;height:30px;border-radius:9px;background:var(--side);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none;margin-top:1px}
.sr-row .bd{flex:1;min-width:0}
.sr-row .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-row .sn{font-family:var(--serif);font-size:14px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr-row .mt{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:var(--faint);flex-wrap:wrap}
.sr-row mark{background:var(--accent-soft);color:var(--accent-text);border-radius:3px;padding:0 1px}
.sr-row .op{display:flex;gap:4px;flex:none;opacity:0;transition:.1s}
.sr-row:hover .op,.sr-row.sel .op{opacity:1}
.sr-row .op button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);font:600 11px var(--mono);color:var(--muted)}
.sr-row .op button:hover{border-color:var(--accent);color:var(--accent-text)}
.sr-foot{flex:none;border-top:1px solid var(--line);padding:9px 24px;display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);background:var(--side)}
.org-search{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);width:240px;font-size:13px}
.org-search:hover{border-color:var(--line2);color:var(--text)}

/* modal: yeni klasör */
.modal-bg{position:fixed;inset:0;background:rgba(20,18,15,.35);z-index:75;display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mh2{display:flex;align-items:center;padding:14px 16px 6px}
.mh2 h3{margin:0;flex:1;font:500 18px var(--serif)}
.mb{padding:4px 16px 8px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.fl{font-size:12px;font-weight:600;margin-top:8px}
.fl span{font-weight:400;color:var(--muted)}
.inp{flex:1;min-width:0;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;background:var(--bg);outline:0}
.inp:focus{border-color:var(--accent)}
.picker{border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.pk-h,.pk-f{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--side);color:var(--muted)}
.pk-h{border-bottom:1px solid var(--line)} .pk-f{border-top:1px solid var(--line)}
.pk-s{border:1px solid var(--line);border-radius:6px;padding:2px 7px;width:110px;background:var(--panel);outline:0;font-size:12px}
.pk-l{max-height:150px;overflow:auto;padding:4px}
.pk-i{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:7px;text-align:left}
.pk-i svg{color:var(--faint)}
.pk-i span{flex:1}
.pk-i:hover{background:var(--hover)}
.pk-i.on{background:var(--accent-soft);color:var(--accent-text)} .pk-i.on svg{color:var(--accent)}
.picks{border:1px solid var(--line2);border-radius:10px;max-height:170px}
.pk-c{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;min-width:0}
.pk-c:hover{background:var(--hover)}
.pk-c .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-c input{accent-color:var(--accent)}
.pk-g{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;padding:8px 8px 3px}
.picker.err{border-color:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.12)}
select.inp{appearance:auto;padding:6px 8px}
.mf{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}

/* menu / toast */
.menu{position:fixed;z-index:70;min-width:200px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.14);padding:4px;font-size:13px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;border-radius:6px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .mh{padding:4px 9px 2px;font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:7px 14px;border-radius:9px;font-size:12.5px;transition:.2s;pointer-events:none;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){ .info{position:fixed;right:0;top:44px;bottom:0;z-index:25;box-shadow:var(--shadow)} }
@media (max-width:640px){
  .grid.l2,.grid.l3,.grid.l4{grid-template-columns:1fr;grid-template-rows:none}
  .layouts,.tb-title{display:none}
}
</style>

<div class="app">
  <header class="topbar">
    <div class="lights"><i></i><i></i><i></i></div>
    <button class="ibtn" id="btnOrg" title="Sohbetler ve klasörler (⌘B)"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></span>Claude Panel</div>

      <button data-l="3" title="Üç sütun"><svg viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="16" height="12" rx="2"/><path d="M6.3 1v12M11.7 1v12"/></svg></button>
      <button data-l="4" title="2×2"><svg viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="16" height="12" rx="2"/><path d="M9 1v12M1 7h16"/></svg></button>
    </div>
    <span class="tb-title" id="tbTitle"></span>

    const dx = b.x-a.x, dy = b.y-a.y, L2 = dx*dx+dy*dy || 1; const u = Math.max(0, Math.min(1, ((wx-a.x)*dx + (wy-a.y)*dy)/L2));
    const d = Math.hypot(a.x+u*dx-wx, a.y+u*dy-wy); if(d < bd){ bd = d; best = i; } });
  return best;
}

function gFrame(){

}

function gFit(){

}

function gLocal(e){ const r = $('#gvCanvas').getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function gDown(e){

    G.act = {type:'link', from:n.id, sx, sy}; G.linkFrom = n.id; gHud(); return; }

function gUp(e){

function gAddLink(a, b){

function gAction(k, d){

  if(k==='newin' && n){ newChat({group:n.id}); return; }

const PROMPTS = {s2:'robots.txt içindeki Sitemap satırını www ile düzelt, canonical etiketlerini kontrol et', s3:'Erdallar için anahtar kelime raporu ve sitemap kontrolü', s5:'Derin Ajans teklif şablonunu Word olarak hazırla, fiyat tablosu ekle',

  s10:'Palmiyeet menü sayfasını kategorilere ayır, mobil görünümü düzelt', s11:'Madrida rezervasyon formuna tarih seçici ve WhatsApp bildirimi ekle', s12:'Cezveden stok entegrasyonu, XML ürün beslemesini senkronla'};
const SR = {open:false, q:'', scope:'all', folder:null, sel:0, res:[]};
function textOf(s){
  const msg = s.msgs.map(m => m.r==='u' ? m.t : m.b.map(b => b.t==='text' ? b.v.replace(/<[^>]+>/g,'') : b.a+' '+b.o).join(' ')).join(' \n ');
  return (msg || PROMPTS[s.id] || '') + ' ' + s.outputs.join(' ');
}
function hl(text, q){ if(!q) return esc(text); const i = text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length)); }
function snippet(text, q){ const t = text.replace(/\s+/g,' ').trim(); if(!q) return t.slice(0,180);
  const i = t.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return t.slice(0,180);
  const a = Math.max(0, i-60); return (a?'…':'') + t.slice(a, a+200); }
function inFolder(s, fid){ let f = s.folder; while(f){ if(f===fid) return true; f = fold(f)?.parent; } return false; }
function setSearch(v){ SR.open = v; renderRail(); $('#srch').classList.toggle('open', v); if(v){ SR.sel=0; renderSearch(); setTimeout(()=>{ const i=$('#sq'); i.focus(); i.select(); }, 30); } }
function renderSearch(){
  const q = SR.q.trim(), ql = q.toLowerCase();

    + S.folders.filter(f=>!f.parent).map(f=>`<button class="chipb ${SR.folder===f.id?'on':''}" data-sfold="${f.id}"><span class="dot" style="background:${f.color}"></span>${esc(f.name)}</button>`).join('');
  const res = [];
  S.items.filter(id=>id[0]==='s' && !gone(id)).map(sess).forEach(s => {
    if(SR.folder && !inFolder(s, SR.folder)) return;
    const body = textOf(s);
    const tHit = !q || s.title.toLowerCase().includes(ql) || s.project.toLowerCase().includes(ql);
    const cHit = q && body.toLowerCase().includes(ql);
    const fHit = q && s.outputs.some(o=>o.toLowerCase().includes(ql));
    const ok = SR.scope==='all' ? (tHit||cHit) : SR.scope==='title' ? tHit : SR.scope==='content' ? cHit : (q ? fHit : s.outputs.length);
    if(ok) res.push({s, score: (s.title.toLowerCase().includes(ql)?2:0) + (cHit?1:0), body});
  });
  if(q) res.sort((a,b)=>b.score-a.score);
  SR.res = res; SR.sel = Math.min(SR.sel, Math.max(0,res.length-1));
  const head = q ? `${res.length} sonuç · “${esc(q)}”` : 'Son sohbetler';
  $('#srList').innerHTML = `<div class="sr-gh"><span>${head}</span><span>${S.sessions.length} oturum tarandı</span></div>` + (res.length ? res.map((r,i)=>{
    const s = r.s, f = fold(s.folder), p = paneOf(s.id);
    const lead = s.status==='running' ? '<span class="spin"></span>' : s.status==='elsewhere' ? '<span class="edot"></span>' : ic(SR.scope==='files'?'file':'msg');
    const sn = SR.scope==='files' ? s.outputs.map(o=>hl(o,q)).join(' · ') : hl(snippet(r.body, q), q);
    return `<div class="sr-row ${i===SR.sel?'sel':''}" data-sres="${i}">
      <span class="ico">${lead}</span>
      <div class="bd"><div class="tt">${hl(s.title,q)}</div>${sn?`<div class="sn">${sn}</div>`:''}
        <div class="mt">${f?`<span class="chip"><span class="dot" style="background:${f.color}"></span>${esc(f.name)}</span>`:'<span>Klasörsüz</span>'}<span class="mono">${hl(s.project.replace('~/Desktop/',''),q)}</span><span>${s.ago}</span><span>${s.model}</span>${p?`<span class="rc-badge" style="background:var(--accent);color:#fff">Bölme ${p}</span>`:''}${s.remote?`<span class="rc-badge">${ic('cursor')}Uzaktan</span>`:''}</div></div>
      <div class="op">${Array.from({length:nPanes()},(_,k)=>`<button data-sopen="${s.id}" data-into="${k}" title="Bölme ${k+1}'de aç">${k+1}</button>`).join('')}</div></div>`; }).join('')
    : `<div style="text-align:center;color:var(--muted);padding:60px 0"><div style="font:500 18px var(--serif);color:var(--text)">Sonuç yok</div>Farklı bir kelime dene veya filtreyi “Her yer” yap.</div>`);
  document.querySelector('.sr-row.sel')?.scrollIntoView({block:'nearest'});
}

function qr(seed){ let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0; let r=''; const n=11;

    if(corner ? !(x%10===1&&y%10===1) && ((x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7)) : (h>>16)&1) r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg class="qr" viewBox="0 0 11 11" fill="#1a1a1a">${r}</svg>`; }

function send(i){
  const ta = document.querySelector(`[data-ta="${i}"]`); const s = sess(S.panes[i]);
  const txt = ta.value.trim(); if(!txt || !s) return;
  ta.value=''; s.msgs.push({r:'u', t:txt});
  const reply = {r:'a', b:[{t:'text', v:''}], streaming:true}; s.msgs.push(reply);
  s.status='running'; s.ago='şimdi'; render();
  const full = 'Tamam, bu bölmede ayrı bir claude süreci çalışıyor; diğer bölmeler beklemeden paralel ilerliyor. Yanıt aynı .jsonl dosyasına yazıldığı için Claude Code uygulamasında da görünecek.';
  let k = 0;
  s._tick = setInterval(() => {
    k += 3; reply.b[0].v = `<p>${esc(full.slice(0,k))}</p>`; s.ctx += 0.15;
    if(k >= full.length){ clearInterval(s._tick); reply.streaming=false; s.status='idle'; render(); toast(`Bölme ${i+1} tamamlandı`); return; }
    const el = document.querySelector(`[data-pane="${i}"] .msgs`);
    if(el){ el.querySelector('.msgs-in').innerHTML = renderMsgs(s); el.scrollTop = el.scrollHeight; }
  }, 30);
}

let NC = null;
function newChat(opts={}){
  const cur = sess(S.panes[S.active]); const cf = cur && fold(cur.folder);
  const group = opts.group !== undefined ? opts.group : (S.org && curFolder()) ? curFolder() : (cf ? cf.id : null);
  const g = group && fold(group);
  NC = {pane: opts.pane ?? S.active, group, dir: g && g.dir ? g.dir : null, dq:'', model:'Opus 5.5', text:''};
  renderNC(); setTimeout(()=>$('#ncDq')?.focus());
}
function recentDirs(){
  const seen = new Map();
  S.items.filter(id=>id[0]==='s').map(sess).forEach(s => { if(!seen.has(s.project)) seen.set(s.project, s.ago); });
  return [...seen].map(([dir, ago]) => ({dir, ago}));
}

        <div class="pk-l" style="max-height:220px">
          ${rec.length?`<div class="pk-g">Son kullanılan projeler</div>${rec.map(r=>row(r.dir, r.ago)).join('')}`:''}
          ${disk.length?`<div class="pk-g">Masaüstü</div>${disk.map(d=>row(d,'')).join('')}`:''}

function ncSync(){ if(!NC) return; NC.group = $('#ncGroup')?.value || null; NC.model = $('#ncModel')?.value || NC.model; NC.text = $('#ncText')?.value ?? NC.text; }
function startChat(){
  ncSync();
  if(!NC.dir){ NC.err = true; renderNC(); return; }
  const id='s'+Date.now(); const name = NC.dir.split('/').pop();
  const text = NC.text.trim();
  S.sessions.unshift({id, title: text ? text.slice(0,40) : `Yeni sohbet · ${name}`, project:NC.dir, folder:NC.group, status:'idle', ago:'şimdi', model:NC.model, ctx:0.4, outputs:[], msgs:[]});
  S.items.unshift(id);
  const pane = NC.pane; NC = null; renderNC();
  setSearch(false); setOrg(false); openIn(id, pane);
  if(text){ const ta = document.querySelector(`[data-ta="${pane}"]`); ta.value = text; send(pane); }
  else document.querySelector(`[data-ta="${pane}"]`)?.focus();
  toast(`${name} klasöründe yeni sohbet`);
}

document.addEventListener('click', e => {
  const t = e.target;
  const m = t.closest('.menu [data-m]');
  if(m){
    const d = m.dataset;
    if(d.m==='open'){ setOrg(false); openIn(d.id, +d.i); }
    if(d.m==='move'){ sess(d.id).folder = d.f||null; sess(d.id).fresh=false; render(); toast('Taşındı'); }
    if(d.m==='pin'){ sess(d.id).pinned = !sess(d.id).pinned; render(); }
    if(d.m==='ext') toast('Claude uygulamasında açılacak: '+d.id);
    if(d.m==='ren'){ renaming = d.f; if(!S.org) setOrg(true); renderBoard(); }
    if(d.m==='sort'){ FX.sort = d.k; renderBoard(); }
    const tgtIds = () => (d.id && !FX.sel.has(d.id)) ? [d.id] : [...FX.sel];
    if(d.m==='movedlg'){ closeMenu(); openMove(tgtIds()); return; }
    if(d.m==='trash'){ closeMenu(); trashItems(tgtIds()); return; }
    if(d.m==='restore'){ closeMenu(); restoreItems([...FX.sel]); return; }
    if(d.m==='hide'){ closeMenu(); [...FX.sel].forEach(id=>objOf(id).hidden=true); FX.sel.clear(); render(); return; }
    if(d.m==='cut'){ FX.clip = [...FX.sel]; renderBoard(); toast(`${FX.clip.length} öğe kesildi · hedef klasörde ⌘V`); }
    if(d.m==='withsel'){ closeMenu(); openNewFolder(curFolder(), [...FX.sel]); return; }
    if(d.m==='ql'){ closeMenu(); quickLook(d.id); return; }
    if(d.m==='nav'){ setOrg(true); go(d.f); }
    if(d.m==='sub') openNewFolder(d.f);
    if(d.m==='newin'){ closeMenu(); newChat({group:d.f}); return; }
    if(d.m==='top'){ fold(d.f).parent = null; renderBoard(); }
    if(d.m==='color'){ fold(d.f).color = d.c; render(); }
    if(d.m==='openall'){
      const all = id => children(id).flatMap(c => c[0]==='f' ? all(c) : [c]);
      const ids = all(d.f).slice(0,4);
      S.layout = ids.length>=4?4:Math.max(1,ids.length); ids.forEach((id,i)=>S.panes[i]=id); S.active=0; setOrg(false); render();
    }
    if(d.m==='del'){
      const f = fold(d.f); S.sessions.forEach(s=>{ if(s.folder===d.f) s.folder=f.parent; });
      S.folders.forEach(x=>{ if(x.parent===d.f) x.parent=f.parent; });
      S.folders = S.folders.filter(x=>x.id!==d.f); S.items = S.items.filter(x=>x!==d.f); render(); toast('Klasör silindi');
    }
    closeMenu(); return;
  }
  closeMenu();
  const mvb = t.closest('[data-mv]'); if(mvb){ MV.target = mvb.dataset.mv || null; renderMove(); return; }
  if(t.closest('[data-mvx]')){ MV=null; renderMove(); return; }
  if(t.closest('[data-mvgo]')){ const ids = MV.ids, tg = MV.target; MV=null; renderMove(); moveInto(ids, tg); return; }
  if(t.closest('[data-mvnew]')){ const ids = MV.ids, tg = MV.target; MV=null; renderMove(); openNewFolder(tg, ids); return; }
  if(MV && t.classList.contains('modal-bg')){ MV=null; renderMove(); return; }
  const qo = t.closest('[data-qlopen]'); if(qo){ const id = QL; quickLook(null); if(qo.dataset.qlopen==='f'){ go(id); } else { setOrg(false); openIn(id, +qo.dataset.qlopen); } return; }
  if(t.closest('[data-qlx]') || (QL && t.classList.contains('modal-bg'))){ quickLook(null); return; }
  const nc = t.closest('[data-nc]');
  if(nc){ const d = nc.dataset; ncSync();
    if(d.nc==='close'){ NC=null; renderNC(); return; }
    if(d.nc==='dir'){ NC.dir = d.d; NC.err = false; const lf = S.folders.find(f=>f.dir===d.d); if(lf && !NC.group) NC.group = lf.id; }
    if(d.nc==='finder'){ NC.dir = '~/Projects/musteri-x'; NC.err=false; toast('Electron: dialog.showOpenDialog({properties:[\'openDirectory\']})'); }
    if(d.nc==='mkdir'){ const n = prompt('Yeni klasör adı (~/Desktop içinde)', 'yeni-proje'); if(n){ NC.dir = '~/Desktop/'+n.trim(); NC.err=false; DISK.unshift(n.trim()); toast('Klasör oluşturulacak: '+NC.dir); } }
    if(d.nc==='uselinked') NC.group = d.f;
    if(d.nc==='start'){ startChat(); return; }
    renderNC(); return; }
  if(NC && t.classList.contains('modal-bg')){ NC=null; renderNC(); return; }
  const nf = t.closest('[data-nf]');
  if(nf){ const d = nf.dataset; NF.name = $('#nfName')?.value ?? NF.name;
    if(d.nf==='close'){ NF=null; renderNF(); return; }

  if(it){ e.preventDefault(); const id = it.dataset.item; if(!FX.sel.has(id)){ FX.sel = new Set([id]); paintSel(); }
    if(FX.sel.size > 1 || FX.cwd===TRASH) selMenu(e.clientX, e.clientY);
    else id[0]==='f' ? folderMenu(id, e.clientX, e.clientY) : sessMenu(id, e.clientX, e.clientY); return; }
  const sf = e.target.closest('.fx-si[data-nav^="f"]'); if(sf){ e.preventDefault(); folderMenu(sf.dataset.nav, e.clientX, e.clientY); }
});
function commitRename(inp){ const id = inp.dataset.ren, v = inp.value.trim()||'Adsız'; if(id[0]==='f'){ const f = fold(id); if(f) f.name = v; } else { const s = sess(id); if(s) s.title = v; } renaming=null; }
document.addEventListener('keydown', e => {
  if(e.target.matches('[data-ren]')){
    if(e.key==='Enter'){ commitRename(e.target); render(); }
    if(e.key==='Escape'){ renaming=null; renderBoard(); }
    e.stopPropagation(); return;
  }
  if(e.target.matches('[data-ta]') && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(+e.target.dataset.ta); return; }
  if(NC){ if(e.key==='Escape'){ NC=null; renderNC(); } if(e.key==='Enter' && e.metaKey){ e.preventDefault(); startChat(); } return; }
  if(e.metaKey && !e.shiftKey && e.key.toLowerCase()==='n'){ e.preventDefault(); newChat(); return; }
  if(NF){ if(e.key==='Escape'){ NF=null; renderNF(); } if(e.key==='Enter' && e.target.id==='nfName'){ createFolder(); } return; }
  if(SR.open){
    if(e.key==='Escape'){ setSearch(false); return; }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); SR.sel = Math.max(0, Math.min(SR.res.length-1, SR.sel + (e.key==='ArrowDown'?1:-1))); renderSearch(); return; }
    if(e.key==='Enter' && SR.res[SR.sel]){ e.preventDefault(); openFromSearch(SR.res[SR.sel].s.id); return; }
    if(e.metaKey && /^[1-4]$/.test(e.key) && SR.res[SR.sel] && +e.key<=nPanes()){ e.preventDefault(); openFromSearch(SR.res[SR.sel].s.id, +e.key-1); return; }
    if(e.metaKey && e.key.toLowerCase()==='k'){ e.preventDefault(); setSearch(false); return; }
  }
  if(QL){ if(e.key===' '||e.key==='Escape'){ e.preventDefault(); quickLook(null); } return; }
  if(MV){ if(e.key==='Escape'){ MV=null; renderMove(); } if(e.key==='Enter'){ const ids=MV.ids, tg=MV.target; MV=null; renderMove(); moveInto(ids, tg); } return; }
  if(S.org && !e.target.matches('input,textarea,select')){
    if(FX.cwd===GRAPH && gKey(e)) return;
    const sel = [...FX.sel];
    if(e.key===' ' && sel.length===1){ e.preventDefault(); quickLook(sel[0]); return; }
    if(e.metaKey && e.key.toLowerCase()==='x' && sel.length){ e.preventDefault(); FX.clip = sel; renderBoard(); toast(`${sel.length} öğe kesildi · hedef klasörde ⌘V`); return; }
    if(e.metaKey && e.key.toLowerCase()==='v' && FX.clip){ e.preventDefault(); if(FX.cwd && FX.cwd[0]===':'){ toast('Buraya yapıştırılamaz'); return; } const c = FX.clip; FX.clip = null; moveInto(c, FX.cwd); return; }
    if(e.metaKey && e.key==='Backspace' && sel.length){ e.preventDefault(); FX.cwd===TRASH ? restoreItems(sel) : trashItems(sel); return; }
    if(e.ctrlKey && e.metaKey && e.key.toLowerCase()==='n' && sel.length){ e.preventDefault(); openNewFolder(curFolder(), sel); return; }
    if(e.key==='Enter' && sel.length){ e.preventDefault(); openItem(sel[0]); return; }
    if(e.key==='F2' && sel.length===1){ e.preventDefault(); renaming = sel[0]; renderBoard(); return; }
    if(e.key==='Backspace' || (e.metaKey && e.key==='ArrowUp')){ e.preventDefault(); goUp(); return; }
    if(e.metaKey && e.key==='ArrowDown' && sel.length){ e.preventDefault(); openItem(sel[0]); return; }
    if(e.metaKey && e.key==='['){ e.preventDefault(); goBack(); return; }
    if(e.metaKey && e.key===']'){ e.preventDefault(); goFwd(); return; }
    if(e.metaKey && e.key.toLowerCase()==='a'){ e.preventDefault(); FX.sel = new Set(listing()); renderBoard(); return; }
    if(e.metaKey && e.shiftKey && e.key.toLowerCase()==='n'){ e.preventDefault(); openNewFolder(curFolder()); return; }
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
      const ids = listing(); if(!ids.length) return; e.preventDefault();
      const cols = FX.view==='grid' ? Math.max(1, Math.round(($('.fx-grid')?.clientWidth||600) / (($('.fx-it')?.offsetWidth||118)+8))) : 1;
      const step = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-cols, ArrowDown:cols}[e.key];
      const cur = FX.anchor && ids.includes(FX.anchor) ? ids.indexOf(FX.anchor) : -1;
      const nx = Math.max(0, Math.min(ids.length-1, cur<0 ? 0 : cur+step)); FX.sel = new Set([ids[nx]]); FX.anchor = ids[nx]; renderBoard(); return; }
  }
  if(e.key==='Escape' && S.org){ setOrg(false); return; }
  if(e.metaKey && e.key.toLowerCase()==='b'){ e.preventDefault(); setOrg(!S.org); }
  if(e.metaKey && e.key.toLowerCase()==='i'){ e.preventDefault(); S.info=!S.info; render(); }
  if(e.metaKey && e.key.toLowerCase()==='k'){ e.preventDefault(); setSearch(true); }
  if(e.metaKey && /^[1-4]$/.test(e.key)){ e.preventDefault(); const i=+e.key-1; if(i < nPanes()){ S.active=i; render(); } }
});
document.addEventListener('focusout', e => { if(e.target.matches('[data-ren]')){ commitRename(e.target); setTimeout(render); } });
document.addEventListener('input', e => {
  if(e.target.id==='ncDq'){ ncSync(); NC.dq = e.target.value; renderNC(); const i=$('#ncDq'); i.focus(); i.setSelectionRange(999,999); }
  if(e.target.id==='sq'){ SR.q = e.target.value; SR.sel = 0; renderSearch(); }
  if(e.target.id==='nfDq'){ NF.dq = e.target.value; NF.name = $('#nfName').value; renderNF(); const i=$('#nfDq'); i.focus(); i.setSelectionRange(99,99); }
  if(e.target.matches('[data-ta]')){ e.target.style.height='auto'; e.target.style.height=e.target.scrollHeight+'px'; }
});

/* drag & drop — Finder gibi:
   · öğeyi bir klasör simgesine / kenar çubuğundaki klasöre / yol çubuğundaki bir klasöre bırak → içine taşınır
   · boş alana bırak → bulunduğun klasöre taşınır · sohbeti bölme şeridine veya bir bölmeye bırak → orada açılır
   · ⌘/⇧ ile birden fazla öğe seçip birlikte sürükleyebilirsin */
const clearDrop = () => document.querySelectorAll('.drop,.dropping,.dropin,.dragging').forEach(x=>x.classList.remove('drop','dropping','dropin','dragging'));
/* İşaretçi (pointer) tabanlı sürükleme: Electron/Chrome'da HTML5 DnD'den daha güvenilir, özel "hayalet" gösterir */
let pd = null; // {id, x, y, started, ghost}
let justDragged = false;
document.addEventListener('pointerdown', e => {
  const it = e.target.closest('#fxBody [data-item]');
  if(!it || e.button!==0 || e.target.closest('.rename')) return;
  pd = {id: it.dataset.item, x: e.clientX, y: e.clientY, started:false};
});
document.addEventListener('pointermove', e => {
  if(!pd) return;
  if(!pd.started){
    if(Math.hypot(e.clientX-pd.x, e.clientY-pd.y) < 6) return;
    pd.started = true;
    if(!FX.sel.has(pd.id)){ FX.sel = new Set([pd.id]); paintSel(); }
    drag = {ids:[...FX.sel]};
    document.querySelectorAll('#fxBody [data-item]').forEach(el=>{ if(FX.sel.has(el.dataset.item)) el.classList.add('dragging'); });
    const g = document.createElement('div'); g.className = 'drag-ghost';
    const first = drag.ids[0];
    g.innerHTML = `${first[0]==='f'?fsvg('fsm', fullF(first)):ic('msg')}<span>${esc(nameOf(first))}</span>${drag.ids.length>1?`<b>${drag.ids.length}</b>`:''}`;
    document.body.appendChild(g); pd.ghost = g; document.body.classList.add('dragging-now');
  }
  pd.ghost.style.transform = `translate(${e.clientX+12}px, ${e.clientY+10}px)`;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const t = el ? dropTarget({target: el}) : null;
  document.querySelectorAll('.drop,.dropping,.dropin').forEach(x=>x.classList.remove('drop','dropping','dropin'));
  if(t) t.el.classList.add(t.cls);
  armSpring(t && t.cls==='drop' && t.el.dataset.fdrop ? t.el : null);
  pd.target = t;
});
function endPointerDrag(e, cancel){
  if(!pd) return;
  if(pd.started){
    justDragged = true; setTimeout(()=>justDragged=false, 0);
    pd.ghost?.remove(); document.body.classList.remove('dragging-now');
    clearTimeout(spring.timer); spring.el = null;
    const el = !cancel && document.elementFromPoint(e.clientX, e.clientY);
    const t = el ? dropTarget({target: el}) : null;
    clearDrop(); if(t) t.act();
    drag = null;
  }
  pd = null;
}
document.addEventListener('pointerup', e => endPointerDrag(e, false));
document.addEventListener('pointercancel', e => endPointerDrag(e, true));
document.addEventListener('keydown', e => { if(e.key==='Escape' && pd && pd.started){ e.stopImmediatePropagation(); endPointerDrag(e, true); clearDrop(); } }, true);
document.addEventListener('dragstart', e => { if(e.target.closest && e.target.closest('#fxBody')) e.preventDefault(); });
function moveInto(ids, target){
  let moved = 0;
  ids.forEach(id => {
    if(id[0]==='f'){ if(target && inside(target, id)) return; fold(id).parent = target; fold(id).trashed = false; }
    else { const s = sess(id); s.folder = target; s.fresh = false; s.trashed = false; }
    moved++;
  });
  FX.sel.clear(); render();
  toast(`${moved} öğe → ${target ? fold(target).name : 'Sohbetler'}`);
}
function dropTarget(e){
  if(!drag) return null;
  const onlySess = drag.ids.every(id=>id[0]==='s');
  if(onlySess){
    const slot = e.target.closest('[data-slot]'); if(slot) return {el:slot, cls:'drop', act:()=>{ setOrg(false); openIn(drag.ids[0], +slot.dataset.slot); }};
    const pane = e.target.closest('.pane'); if(pane) return {el:pane, cls:'dropping', act:()=>openIn(drag.ids[0], +pane.dataset.pane)};
  }
  const fd = e.target.closest('[data-fdrop]');
  if(fd){
    const t = fd.dataset.fdrop || null;
    if(t && drag.ids.includes(t)) return null;
    if(t && drag.ids.some(id=>id[0]==='f' && inside(t,id))) return null;
    if(drag.ids.every(id=>parentOf(id)===t)) return null;
    return {el:fd, cls:'drop', act:()=>moveInto(drag.ids, t)};
  }
  const body = e.target.closest('#fxBody');
  if(body && !(FX.cwd && FX.cwd[0]===':') && !drag.ids.every(id=>parentOf(id)===FX.cwd))
    return {el:body, cls:'dropin', act:()=>moveInto(drag.ids, FX.cwd)};
  return null;
}
let spring = {el:null, timer:null};
function armSpring(el){
  if(spring.el === el) return;
  clearTimeout(spring.timer); spring.el = el;
  const fid = el && el.dataset.fdrop; if(!fid || fid===FX.cwd) return;
  el.classList.add('spring');
  spring.timer = setTimeout(() => { if(drag && spring.el===el){ go(fid); spring.el=null; } }, 900);  // Finder gibi: üstünde bekleyince klasör açılır
}


// başlangıç sırası: önce klasörsüz yeni sohbetler, sonra klasörler ve içerikleri
S.items = [...S.sessions.filter(s=>!s.folder).map(s=>s.id), 'f1','s4','f2','s1','s2','s3','f3','s5','s8','f4','s6','s7','f5','s9'];
S.sessions.filter(s=>!S.items.includes(s.id)).forEach(s=>S.items.push(s.id));
S.folders.filter(f=>!S.items.includes(f.id)).forEach(f=>S.items.push(f.id));
S.sessions.find(s=>s.id==='s8').folder = null; // örnek: klasörsüz sohbet klasörlerin arasında
render();
</script>
